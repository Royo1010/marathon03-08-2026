<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Marathon 2026" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.json?v=2026.10.08-1" />
    <link rel="icon" href="./icon.svg?v=2026.10.08-1" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2026.10.08-1" />
    <link rel="stylesheet" href="./style.css?v=2026.10.08-1" />
    <title>Marathon 2026</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="brand-home" class="header-brand" type="button" aria-label="Open marathonoverzicht">
          <img class="brand-mark" src="./icon.svg?v=2026.10.08-1" width="30" height="30" alt="" />
          <strong>Marathon 2026</strong>
        </button>
      </header>

      <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
      <main id="app" class="content" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Hoofdnavigatie">
        <button class="is-active" type="button" data-view="today" aria-current="page">
          <span class="nav-icon icon icon-house" aria-hidden="true"></span>
          <span>Vandaag</span>
        </button>
        <button type="button" data-view="week">
          <span class="nav-icon icon icon-calendar-days" aria-hidden="true"></span>
          <span>Week</span>
        </button>
        <button type="button" data-view="plan">
          <span class="nav-icon icon icon-list-ordered" aria-hidden="true"></span>
          <span>Schema</span>
        </button>
        <button type="button" data-view="more">
          <span class="nav-icon icon icon-info" aria-hidden="true"></span>
          <span>Meer</span>
        </button>
      </nav>
    </div>

    <script src="./training-data.js?v=2026.10.08-1"></script>
    <script src="./notification-model.js?v=2026.10.08-1"></script>
    <script src="./push-config.js?v=2026.10.08-1"></script>
    <script src="./app.js?v=2026.10.08-1"></script>
  </body>
</html>
